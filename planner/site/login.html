<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — NNA Wallpaper</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/img/star.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="/"><img src="/assets/img/star.svg" alt="">NNA Planner</a>
  </div>
</header>

<main class="wrap doc">
  <div class="page-h">
    <p class="eyebrow">NNA Wallpaper</p>
    <h1>Вход в NNA Wallpaper</h1>
    <p class="lead">Нажмите кнопку — Telegram подтвердит вход, и окно вернётся в приложение.</p>
  </div>

  <div class="card" style="max-width:320px">
    <script>
      function onTelegramAuth(user) {
        var parts = [];
        for (var key in user) {
          if (Object.prototype.hasOwnProperty.call(user, key)) {
            parts.push(encodeURIComponent(key) + '=' + encodeURIComponent(user[key]));
          }
        }
        var query = parts.join('&');

        var params = new URLSearchParams(location.search);
        var portRaw = parseInt(params.get('port'), 10);
        var port = (portRaw >= 1024 && portRaw <= 65535) ? portRaw : 1618;

        location.href = 'http://127.0.0.1:' + port + '/planner/callback?' + query;
      }
    </script>
    <script async src="https://telegram.org/js/telegram-widget.js?22"
      data-telegram-login="NNAplanner_bot" data-size="large" data-userpic="false"
      data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
  </div>

  <p class="muted" style="font-size:12px;margin-top:22px">
    Если кнопка не появилась — домен ещё не привязан к боту (BotFather → /setdomain).
  </p>
  <p class="muted" style="font-size:12px;margin-top:10px">
    <a href="https://planner.nna1618.com">Назад на planner.nna1618.com</a>
  </p>
</main>

<footer>
  <div class="wrap">
    <span>NNA Planner · NNA1618</span>
    <nav class="links" aria-label="Подвал">
      <a href="/">Главная</a>
    </nav>
  </div>
</footer>

</body>
</html>
